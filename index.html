<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SBS RECRUIT｜株式会社山陰物流サービス</title>
<meta name="description" content="株式会社山陰物流サービス 採用提案LP">
<style>
html,body{margin:0;background:#eef4f8;font-family:Arial,'Noto Sans JP',sans-serif}
.page{max-width:1440px;margin:0 auto;background:#fff;position:relative;box-shadow:0 0 40px rgba(0,0,0,.08)}
.mockup{display:block;width:100%;height:auto}
.chat-launch{position:fixed;right:22px;bottom:22px;z-index:30;border:0;border-radius:999px;padding:14px 18px;background:#062d4a;color:#fff;font-weight:800;font-size:12px;box-shadow:0 12px 30px rgba(0,0,0,.25);cursor:pointer}
.chat{position:fixed;right:22px;bottom:78px;z-index:31;width:min(390px,calc(100vw - 28px));height:min(580px,calc(100vh - 96px));display:none;flex-direction:column;background:#fff;border:1px solid #d9e6ed;border-radius:20px;overflow:hidden;box-shadow:0 25px 70px rgba(0,0,0,.28)}
.chat.open{display:flex}.chathead{padding:15px 16px;background:#062d4a;color:#fff;display:flex;justify-content:space-between;align-items:center}.chathead small{display:block;color:#bfe0ee;margin-top:3px;font-size:10px}.close{border:0;background:none;color:#fff;font-size:24px;cursor:pointer}.chatbody{flex:1;overflow:auto;background:#f3f7fa;padding:14px;display:flex;flex-direction:column;gap:8px}.bubble{max-width:90%;padding:10px 12px;border-radius:15px;font-size:12px;line-height:1.7}.bot{background:#fff;border:1px solid #dce7ee}.user{background:#d9f2fc;align-self:flex-end}.choices{display:flex;flex-wrap:wrap;gap:6px}.choice{border:1px solid #b8d1de;background:#fff;border-radius:999px;padding:7px 10px;font-size:10px;cursor:pointer}.chatfoot{display:flex;gap:6px;padding:9px;border-top:1px solid #d9e6ed}.chatfoot input{min-width:0;flex:1;border:1px solid #c9d8e1;border-radius:10px;padding:9px;font-size:12px}.chatfoot button{border:0;border-radius:10px;background:#1276bd;color:#fff;padding:0 13px;font-weight:800}
@media(max-width:600px){.chat-launch{right:12px;bottom:12px}.chat{right:12px;bottom:67px}}
</style></head>
<body>
<div class="page"><img class="mockup" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0a..." alt="SBS RECRUIT 採用LP"></div>
<button class="chat-launch" onclick="openChat()">● SBS RECRUIT ASSISTANT</button>
<div class="chat" id="chat"><div class="chathead"><div><b>SBS RECRUIT ASSISTANT</b><small>採用ページをご案内します</small></div><button class="close" onclick="closeChat()">×</button></div><div class="chatbody" id="chatBody"></div><div class="chatfoot"><input id="chatInput" placeholder="例：未経験でも大丈夫？"><button onclick="send()">送信</button></div></div>
<script>const faq=[{keys:["未経験","経験"],reply:"未経験の方が仕事内容を理解しやすいよう、仕事の流れや働く人の声を見える化する設計です。実際の教育制度や資格支援は公開前に最新情報へ更新します。"},{keys:["仕事内容","仕事"],reply:"ドライバー、倉庫・物流作業など、物流を支える仕事があります。"},{keys:["休み","休日"],reply:"休日・休暇は職種ごとの最新募集条件に合わせて掲載します。"},{keys:["給与","給料","年収"],reply:"給与は最新の募集情報と一致する内容へ更新して公開する想定です。"},{keys:["安心","安全"],reply:"安全運行、車両確認、健康、職場環境など、安心して働ける仕組みを紹介しています。"}];const chat=document.getElementById("chat"),body=document.getElementById("chatBody"),input=document.getElementById("chatInput");function add(t,c="bot"){const b=document.createElement("div");b.className="bubble "+c;b.textContent=t;body.appendChild(b);body.scrollTop=body.scrollHeight}function choices(){const w=document.createElement("div");w.className="choices";["未経験でも大丈夫？","仕事内容は？","休みについて","給与について","安心・安全"].forEach(q=>{const x=document.createElement("button");x.className="choice";x.textContent=q;x.onclick=()=>ask(q);w.appendChild(x)});body.appendChild(w)}function ask(q){add(q,"user");const found=faq.find(item=>item.keys.some(k=>q.includes(k)));setTimeout(()=>{add(found?found.reply:"気になることを選んでください。");if(!found)choices()},180)}function openChat(){chat.classList.add("open");if(!body.children.length){add("こんにちは。SBS RECRUITの採用アシスタントです。仕事・働き方・募集についてご案内します。");choices()}}function closeChat(){chat.classList.remove("open")}function send(){const q=input.value.trim();if(!q)return;input.value="";ask(q)}input.addEventListener("keydown",e=>{if(e.key==="Enter")send()});</script>
</body></html>
